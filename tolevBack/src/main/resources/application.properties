logging.level.org.flywaydb=DEBUG
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.application.name=tolevBack
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate

# JWT (jwt.secret deve ser uma chave Base64 de pelo menos 256 bits)
# O fallback abaixo e SO para desenvolvimento local -- esta no git, logo nao e segredo.
# Em producao o perfil `azure` exige JWT_SECRET sem fallback: falta da variavel derruba o boot.
jwt.secret=${JWT_SECRET:dG9sZXYtbG9jYWwtZGV2LWFwZW5hcy1OQU8tdXNhci1lbS1wcm9kdWNhby0yMDI2}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Health check
# Só o health fica exposto, e sem detalhe: o endpoint é público (o App Service
# sonda sem token) e devolver nome de banco ou versão de disco para a internet
# não ajuda ninguém.
#
# `probes.enabled` cria /actuator/health/liveness, que é o caminho que o App
# Service sonda. A diferença importa: o /actuator/health cheio inclui o
# indicador do banco, e o banco fica parado de propósito para esticar o crédito
# — apontar a sonda para lá faria a plataforma reiniciar a aplicação toda vez
# que o Postgres estivesse desligado. Liveness responde "o processo está vivo",
# que é exatamente a pergunta que justifica um restart.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Motor de análise
# janela-dias: quanto histórico de transação a análise enxerga
# debounce-minutos: intervalo mínimo entre recálculos (eventos de alto impacto furam a janela)
# ocorrencias-minimas: dias distintos em que o achado precisa aparecer para virar recomendação
# impacto-anual-minimo: custo anual (R$) abaixo do qual o achado não vira recomendação
analise.janela-dias=${ANALISE_JANELA_DIAS:180}
analise.debounce-minutos=${ANALISE_DEBOUNCE_MINUTOS:30}
analise.ocorrencias-minimas=${ANALISE_OCORRENCIAS_MINIMAS:3}
analise.impacto-anual-minimo=${ANALISE_IMPACTO_ANUAL_MINIMO:600}
analise.janela-recorrencia-dias=${ANALISE_JANELA_RECORRENCIA_DIAS:30}
analise.cooldown-recriacao-dias=${ANALISE_COOLDOWN_RECRIACAO_DIAS:30}

# Upload de extrato (POST /transactions/extrato)
# O default do Spring e 1MB por arquivo, e extrato de banco passa disso com
# facilidade -- o upload falharia antes de chegar ao controller.
spring.servlet.multipart.max-file-size=${EXTRATO_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${EXTRATO_MAX_REQUEST_SIZE:12MB}

# Gemini (a chave vem só do ambiente — nunca versionar)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
# 120s porque a leitura de um extrato mensal (centenas de linhas num PDF)
# passa dos 30s com folga. Nenhuma chamada ao Gemini roda na thread da
# requisicao, entao esperar mais nao prende ninguem numa tela.
gemini.timeout=${GEMINI_TIMEOUT:120s}
