logging.level.org.flywaydb=DEBUG
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.application.name=tolevBack
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate

# JWT (jwt.secret deve ser uma chave Base64 de pelo menos 256 bits)
jwt.secret=${JWT_SECRET:dG9sZXZTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNg==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# API Key Resend
resend.api-key=${RESEND_API_KEY}
